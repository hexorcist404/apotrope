name: Tests

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    # No branch filter: a stacked PR (base = another fix/** branch, as when
    # these PRs are chained) produced no pull_request-triggered run at all, so
    # it was never checked against its merge preview and offered no check
    # context a branch-protection rule could require.

# One run per ref. Without this the push and pull_request triggers both fire on
# every push to an open PR branch, duplicating a 4-leg matrix (two of them
# Windows) and leaving superseded runs to finish.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "ubuntu-latest"]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests tools

      - name: Type-check (mypy)
        run: mypy src/apotrope tools

      - name: Run tests with coverage
        # Branch coverage is enabled in pyproject.toml ([tool.coverage.run]).
        # The threshold can only ratchet up — raise it as coverage improves.
        run: pytest tests/ -q --tb=short --cov --cov-report=term-missing --cov-fail-under=95

  build-exe:
    name: Build Windows exe (smoke test)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package, dev deps, and PyInstaller
        run: pip install -e ".[dev]" pyinstaller

      - name: Validate committed brand assets
        run: python -m pytest tests/test_brand_assets.py -q

      - name: Build apotrope.exe
        # The preceding focused test validates the committed ICO in this job.
        # build_exe.py also fails if its frozen-executable probe finds no checks.
        run: python build_exe.py

      - name: Verify exe --version
        run: .\dist\apotrope.exe --version

      - name: Verify exe --dry-run
        run: .\dist\apotrope.exe --dry-run --no-color

      - name: Verify remediation commands (PowerShell parse + cmdlet resolution)
        run: python tools/verify_commands.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: apotrope-exe
          path: dist/apotrope.exe
