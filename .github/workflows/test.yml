name: Tests

on:
  # push is deliberately limited to main. It previously also listed feat/** and
  # fix/**, which meant every push to a branch with an open PR matched BOTH
  # triggers and ran the full 4-leg matrix (two legs Windows) plus build-exe
  # twice — PR #110 ran as 31227373294 (push) and 31227375103 (pull_request) on
  # the same commit. The concurrency block below cannot collapse those: a push
  # event leaves github.event.pull_request.number null and falls through to
  # github.ref, so the two events land in different groups by construction.
  #
  # The cost, stated plainly: pushing a feat/** or fix/** branch with NO pull
  # request open now runs nothing. Open the PR as a draft (pull_request fires on
  # drafts) or dispatch this workflow by hand.
  push:
    branches: ["main"]
  pull_request:
    # No branch filter: a stacked PR (base = another fix/** branch, as when
    # these PRs are chained) produced no pull_request-triggered run at all, so
    # it was never checked against its merge preview and offered no check
    # context a branch-protection rule could require.
  workflow_dispatch:

# Deduplication happens at the TRIGGER above, not here. Unifying the group key so
# both events collapse into one — github.event.pull_request.head.ref ||
# github.ref_name does yield an identical string — was rejected: combined with
# cancel-in-progress that is a race, and whichever run starts second kills the
# first. The two runs are not interchangeable (push tests the branch tip,
# pull_request tests the merge preview), and a cancelled run reports `cancelled`
# rather than `success`, which would poison any required-status-check rule added
# later.
#
# What this block still does is collapse superseded runs when a PR branch is
# pushed repeatedly. It must NOT do that on main: cancelling there would leave a
# merged commit that never completed a run. Hence the event-conditional.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "ubuntu-latest"]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests tools

      - name: Type-check (mypy)
        run: mypy src/apotrope tools

      - name: Run tests with coverage
        # Branch coverage is enabled in pyproject.toml ([tool.coverage.run]).
        # The threshold can only ratchet up — raise it as coverage improves.
        run: pytest tests/ -q --tb=short --cov --cov-report=term-missing --cov-fail-under=95

  build-exe:
    name: Build Windows exe (smoke test)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package, dev deps, and PyInstaller
        run: pip install -e ".[dev]" pyinstaller

      - name: Validate committed brand assets
        run: python -m pytest tests/test_brand_assets.py -q

      - name: Build apotrope.exe
        # The preceding focused test validates the committed ICO in this job.
        # build_exe.py also fails if its frozen-executable probe finds no checks.
        run: python build_exe.py

      - name: Verify exe --version
        run: .\dist\apotrope.exe --version

      - name: Verify exe --dry-run
        run: .\dist\apotrope.exe --dry-run --no-color

      - name: Verify remediation commands (PowerShell parse + cmdlet resolution)
        run: python tools/verify_commands.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apotrope-exe
          path: dist/apotrope.exe

  verify-artifact:
    name: Verify exe artifact round-trips
    needs: build-exe
    runs-on: windows-latest
    permissions:
      contents: read

    # This job exists for coverage, not for the exe. download-artifact runs
    # NOWHERE else outside publish.yml, which triggers only on a v* tag push — so
    # before this job, no pull request could exercise it and a bad bump surfaced
    # first during a release, in the job holding id-token: write for PyPI. The
    # upload half was always covered (build-exe, above); the download half was not.
    #
    # It also proves the pair round-trips: upload-artifact's `archive` mode and
    # download-artifact's Content-Type-aware decompression are designed together,
    # and this is the only place on a PR where an artifact goes out and comes back.
    steps:
      - name: Download the exe artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apotrope-exe

      - name: Run the downloaded exe
        # Not `dist\` — download-artifact extracts to the working directory. A
        # bare --version is enough: it proves the file survived the round trip
        # intact and is still an executable, which is what publish.yml relies on.
        run: .\apotrope.exe --version
