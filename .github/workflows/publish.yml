name: Publish to PyPI

# Publishes the package to PyPI whenever a version tag (v*) is pushed.
# Uses PyPI Trusted Publishing (OIDC) — no API token or secret is stored.
# A matching "trusted publisher" must be configured on PyPI for this to work:
#   PyPI project "apotrope" → owner hexorcist404, repo apotrope,
#   workflow "publish.yml", environment "pypi".

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Verify tag matches package version
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          echo "tag=$want pyproject=$got"
          if [ "$want" != "$got" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $got"
            exit 1
          fi

      - name: Run tests
        # Gate publication on the tagged commit passing tests. test.yml does
        # NOT run on tags, so without this gate a v* tag could publish untested
        # code. This is a representative gate (ubuntu / Python 3.12), not the
        # full windows+ubuntu x 3.12+3.13 matrix that test.yml runs on PRs.
        run: pytest tests/ -q --tb=short --cov --cov-fail-under=95

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  validate-wheel:
    name: Validate built wheel (Windows)
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the built wheel and smoke-test it
        # Tests run against the editable install; this proves the *packaged*
        # wheel actually installs and runs on Windows before it ships.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "$(ls dist/*.whl)"
          apotrope --version
          apotrope --dry-run --no-color

  publish:
    name: Publish to PyPI
    needs: [build, validate-wheel]
    runs-on: ubuntu-latest
    # The environment must match the one named in the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/apotrope
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PEP 740 attestations are already the default for Trusted
          # Publishing, but pin it explicitly: PyPI provenance is part of our
          # trust story and must not silently change with an upstream default.
          attestations: true
