name: Publish to PyPI

# Publishes the package to PyPI whenever a version tag (v*) is pushed.
# Uses PyPI Trusted Publishing (OIDC) — no API token or secret is stored.
# A matching "trusted publisher" must be configured on PyPI for this to work:
#   PyPI project "apotrope" → owner hexorcist404, repo apotrope,
#   workflow "publish.yml", environment "pypi".

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        # Gate publication on the tagged commit passing tests. test.yml does
        # NOT run on tags, so without this gate a v* tag could publish untested
        # code. This is a representative gate (ubuntu / Python 3.12), not the
        # full windows+ubuntu x 3.12+3.13 matrix that test.yml runs on PRs.
        run: pytest tests/ -q --tb=short --cov --cov-fail-under=95

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment must match the one named in the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/apotrope
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
